---
- name: Mettre à jour le cache apt (au plus une fois par heure)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Créer l'utilisateur de déploiement
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    state: present
