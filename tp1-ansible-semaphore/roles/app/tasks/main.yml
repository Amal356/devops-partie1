---
- name: Créer le dossier de l'application
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Cloner / mettre à jour le dépôt du portfolio
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: true
  register: app_git
  notify: Redémarrer le portfolio

- name: Vérifier qu'une installation npm complète existe
  ansible.builtin.stat:
    # Fichier écrit par npm à la fin d'une installation réussie
    # (un dossier node_modules seul peut rester incomplet après une coupure réseau)
    path: "{{ app_src_dir }}/node_modules/.package-lock.json"
  register: app_node_modules

- name: Vérifier la présence d'un build Next.js
  ansible.builtin.stat:
    path: "{{ app_src_dir }}/.next/BUILD_ID"
  register: app_build

- name: Installer les dépendances (npm ci) si le code a changé
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ app_src_dir }}"
  register: app_npm_ci
  # Jusqu'à 3 essais en cas de coupure réseau (ECONNRESET)
  retries: 3
  delay: 10
  until: app_npm_ci.rc == 0
  # Pas en --check : le dépôt n'est pas réellement cloné, le dossier n'existe pas
  when: not ansible_check_mode and (app_git.changed or not app_node_modules.stat.exists)
  changed_when: true

- name: Construire l'application (npm run build) si le code a changé
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_src_dir }}"
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
  when: not ansible_check_mode and (app_git.changed or not app_build.stat.exists)
  changed_when: true

- name: Vérifier si l'application est déjà gérée par PM2
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.command:
    cmd: "pm2 describe {{ app_name }}"
  register: app_pm2
  changed_when: false
  failed_when: false
  check_mode: false

- name: Démarrer l'application avec PM2 (port {{ app_port }})
  become: true
  become_user: "{{ deploy_user }}"
  ansible.builtin.shell:
    cmd: "pm2 start npm --name {{ app_name }} -- start && pm2 save"
    chdir: "{{ app_src_dir }}"
  environment:
    PORT: "{{ app_port }}"
    NODE_ENV: production
  when: not ansible_check_mode and app_pm2.rc != 0
  changed_when: true

- name: Activer le démarrage de PM2 au boot (systemd)
  ansible.builtin.command:
    cmd: "pm2 startup systemd -u {{ deploy_user }} --hp {{ deploy_home }}"
    creates: "/etc/systemd/system/pm2-{{ deploy_user }}.service"
  when: not ansible_check_mode
