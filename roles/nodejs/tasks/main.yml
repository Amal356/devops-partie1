---
- name: Créer le dossier des trousseaux apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger la clé GPG NodeSource
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: "{{ nodejs_keyring }}"
    mode: "0644"

- name: Ajouter le dépôt NodeSource (format deb822)
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"
    suites: nodistro
    components: main
    signed_by: "{{ nodejs_keyring }}"
    state: present
  register: nodejs_repo
  # En --check sur un serveur vierge, python3-debian est encore absent
  ignore_errors: "{{ ansible_check_mode }}"

- name: Rafraîchir le cache apt si le dépôt vient d'être ajouté
  ansible.builtin.apt:
    update_cache: true
  when: nodejs_repo.changed

- name: Installer Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Installer PM2 globalement
  community.general.npm:
    name: pm2
    global: true
    state: present
  # Sur un serveur vierge en --check, npm n'existe pas encore
  ignore_errors: "{{ ansible_check_mode }}"
